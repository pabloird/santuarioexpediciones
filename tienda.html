<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Santuario Expediciones">
  <meta property="og:title" content="Tienda — Santuario Expediciones">
  <meta property="og:description" content="Productos artesanales, equipo outdoor Opinel, Stanley, Campante, libros y guías de identificación de especies. Envíos a todo Chile.">
  <meta property="og:url" content="https://santuarioexpediciones.com/tienda.html">
  <meta property="og:image" content="https://santuarioexpediciones.com/assets/img/shop-banner.webp">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tienda — Santuario Expediciones">
  <meta name="twitter:description" content="Productos artesanales, equipo outdoor Opinel, Stanley, Campante, libros y guías de identificación de especies. Envíos a todo Chile.">
  <meta name="twitter:image" content="https://santuarioexpediciones.com/assets/img/shop-banner.webp">
  <link rel="icon" type="image/png" href="assets/img/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/s1lex.css">
</head>
<body>
  <div id="headerSlot"></div>

  <main id="main">
    <section class="shop-banner">
      <img src="assets/img/shop-banner.webp" alt="" aria-hidden="true">
      <div class="container">
        <p data-i18n="shop.bannerText">Envíos a todo Chile</p>
        <h1 data-i18n="shop.bannerTitle">Equípate con nosotros</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="filters" id="productFilters" role="tablist" data-i18n-aria="shop.filtersAria" aria-label="Filtrar productos"></div>
        <p id="productCount" style="text-align:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#757575;margin:-30px 0 40px"></p>
        <div id="productList" class="product-grid"></div>
      </div>
    </section>

    <section class="cta-band">
      <div class="container">
        <h2 data-i18n="shop.ctaTitle">¿No encuentras lo que buscas?</h2>
        <p data-i18n="shop.ctaText">¿Dudas? Pregunta al WhatsApp — te ayudamos a elegir el equipo ideal para tu próxima expedición.</p>
        <a class="btn btn--light" data-wa="products" href="https://wa.me/56994365496?text=Hola%20qu%C3%A9%20tal%2C%20quisieras%20saber%20m%C3%A1s%20de%20nuestros%20productos%3F" target="_blank" rel="noopener" data-i18n="shop.ctaBtn">Preguntar por WhatsApp</a>
      </div>
    </section>
  </main>

  <div id="footerSlot"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/s1lex.js"></script>
</body>
</html>
